<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C++ Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{--bg:#faf8ff;--card:#fff;--fg:#2b2540;--mut:#7b7494;--ac:#9b87f5;--ac2:#ede7ff;--mint:#d6f5e8;--mintf:#1c7a55;--peach:#ffe6d9;--peachf:#b4532a;--bd:#e6e0f5;--ed:#fdfcff;--k:#8250df;--s:#1a7f5a;--n:#c2410c;--c:#9a94ad;--f:#0b6bcb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16131f;--card:#1f1b2d;--fg:#e9e4fa;--mut:#9a92b8;--ac:#a894ff;--ac2:#2b2545;--mint:#16382d;--mintf:#7be3b5;--peach:#40261c;--peachf:#ffab88;--bd:#332c4d;--ed:#1a1627;--k:#c4a7ff;--s:#7be3b5;--n:#ffb27a;--c:#7a7396;--f:#7cb7ff}}
:root[data-theme="dark"]{--bg:#16131f;--card:#1f1b2d;--fg:#e9e4fa;--mut:#9a92b8;--ac:#a894ff;--ac2:#2b2545;--mint:#16382d;--mintf:#7be3b5;--peach:#40261c;--peachf:#ffab88;--bd:#332c4d;--ed:#1a1627;--k:#c4a7ff;--s:#7be3b5;--n:#ffb27a;--c:#7a7396;--f:#7cb7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0;color:var(--ac);white-space:nowrap}
nav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;font:inherit;font-size:13px}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
#th{border:1px solid var(--bd);background:var(--ac2);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
select{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 10px;font:inherit;font-size:13px}
main{display:grid;gap:14px;padding:14px}
aside{display:none}
aside nav{flex-direction:column;gap:2px;overflow:visible}aside nav button{border-radius:10px;text-align:left;width:100%;padding:7px 10px;border-color:transparent;background:transparent;white-space:normal;display:flex;gap:6px;align-items:baseline}aside nav button:hover{background:var(--ac2)}aside nav button.on{background:var(--ac);color:#fff}
aside nav button .no{min-width:20px;color:var(--mut);font-size:12px}aside nav button.on .no{color:#fff}
aside nav button .pr{margin-left:auto;font-size:11px;color:var(--mut);white-space:nowrap}aside nav button.on .pr{color:#fff}
@media(max-width:899px){header{flex-wrap:wrap}header h1{flex:1}header nav{order:3;flex-basis:100%}}
@media(min-width:900px){main{grid-template-columns:230px minmax(0,1fr);padding:14px 18px;align-items:start}header nav{display:none}header{justify-content:space-between}aside{display:block;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}#prac{grid-template-columns:minmax(290px,380px) minmax(0,1fr)}.ed{max-height:560px;min-height:320px;font-size:14px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;min-width:0}
h2{font-size:16px;margin:0 0 6px}h3{font-size:13px;margin:12px 0 4px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
p{margin:0 0 8px}
.hint{background:var(--peach);color:var(--peachf);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
.btn{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit;font-size:14px}
.btn.g{background:var(--ac2);color:var(--fg)}.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
.ed{display:flex;max-height:420px;min-height:240px;overflow:auto;background:var(--ed);border:1px solid var(--bd);border-radius:12px;font:13.5px/20px ui-monospace,Consolas,Menlo,monospace}
.gut{padding:10px 8px;text-align:right;color:var(--c);user-select:none;position:sticky;left:0;background:var(--ed);border-right:1px solid var(--bd)}
.code{position:relative;flex:1;min-width:max-content}
pre{margin:0;padding:10px 12px;font:inherit;white-space:pre;pointer-events:none}
textarea.src{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:10px 12px;border:0;outline:0;resize:none;overflow:hidden;white-space:pre;background:transparent;color:transparent;caret-color:var(--fg);font:inherit;tab-size:4}
.ln{height:20px}.ln.er{background:rgba(239,68,68,.18);box-shadow:inset 3px 0 #ef4444}
pre .k{color:var(--k)}pre .s{color:var(--s)}pre .n{color:var(--n)}pre .c{color:var(--c);font-style:italic}pre .f{color:var(--f)}
#pop{position:absolute;display:none;background:var(--card);border:1px solid var(--ac);border-radius:8px;z-index:4;min-width:150px;box-shadow:0 6px 18px rgba(0,0,0,.15);overflow:hidden}
#pop div{padding:3px 10px;cursor:pointer}#pop div.on{background:var(--ac);color:#fff}
textarea.inp{width:100%;height:52px;border:1px solid var(--bd);border-radius:10px;background:var(--ed);color:var(--fg);padding:6px 10px;font:13px ui-monospace,Consolas,monospace;resize:vertical}
.out{background:var(--ed);border:1px solid var(--bd);border-radius:10px;padding:10px;font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;min-height:40px;max-height:300px;overflow:auto}
.v{border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:600}.ok{background:var(--mint);color:var(--mintf)}.bad{background:var(--peach);color:var(--peachf)}
table{border-collapse:collapse;width:100%;font:13px ui-monospace,Consolas,monospace}td,th{border:1px solid var(--bd);padding:4px 8px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:500}tr.x td{background:var(--peach);color:var(--peachf)}tr.y td{background:var(--mint);color:var(--mintf)}
.cd{background:var(--ed);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font:12.5px/1.55 ui-monospace,Consolas,Menlo,monospace;white-space:pre;overflow:auto;margin:8px 0 12px;pointer-events:auto}
.sg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr))}.sg h3{margin-top:0}
#wrap{display:grid;gap:12px;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;font:inherit;font-size:14px}
.tabs button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
#prac{display:grid;gap:14px}
.rd{max-width:860px}.rd h2{font-size:21px;margin:0 0 4px}.rd .sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.rd h4{font-size:16px;margin:22px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
.rd p{font-size:15.5px;line-height:1.65}.rd ul,.rd ol{margin:0 0 10px;padding-left:22px}.rd li{margin:3px 0}
.toc{background:var(--ac2);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:14px}.toc a{color:var(--fg);text-decoration:none;display:block;padding:2px 0}.toc a:hover{color:var(--ac)}
.fm{background:var(--ed);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:10px 14px;margin:8px 0 12px;font-size:16px;overflow-x:auto;overflow-y:hidden}
.note{background:var(--mint);color:var(--mintf);border-radius:10px;padding:9px 12px;margin:8px 0 12px;font-size:14.5px}
.warn{background:var(--peach);color:var(--peachf);border-radius:10px;padding:9px 12px;margin:8px 0 12px;font-size:14.5px}
.pn{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:12px;border-top:1px solid var(--bd)}
.done{color:var(--mintf)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 10px}
.chips button{width:34px;height:30px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer;font:inherit;font-size:13px;padding:0}
.chips button.ok{background:var(--mint);color:var(--mintf);border-color:var(--mintf)}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.task{font-size:15px}.task .fm{font-size:15px}
.vl{counter-reset:v;list-style:none;padding:0}.vl li{padding:8px 10px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:start}
.vl li b{color:var(--ac)}.vl li .fm{margin:4px 0 0;font-size:14px}
.eng{color:var(--mut);font-size:12px}
.sp{display:inline-block;width:14px;height:14px;border:2px solid var(--ac);border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes r{to{transform:rotate(360deg)}}
.prog{height:6px;border-radius:9px;background:var(--ac2);overflow:hidden;margin:2px 0 10px}.prog i{display:block;height:100%;background:var(--mintf)}
/* Compact topic navigation, shared on phones and computers. */
main{grid-template-columns:minmax(0,1fr);max-width:1440px;margin:auto}
header h1{flex:1}
.topic-picker{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;min-width:0}
.topic-picker label{font-size:13px;color:var(--mut);white-space:nowrap}
#topicSelect{flex:1;min-width:0;max-width:100%;border-radius:10px;padding:10px 12px;font-size:15px;background:var(--ac2);color:var(--fg);text-overflow:ellipsis;cursor:pointer}
.tabs{flex-wrap:wrap;overflow:visible}
.tabs button{min-height:42px}
@media(max-width:600px){.topic-picker{flex-direction:column;align-items:stretch;gap:6px}.tabs{gap:6px}.tabs button{padding:8px 10px;font-size:13px}}
</style>
</head>
<body>
<header><h1>C++ Studio</h1><select id="lg"><option value="kk">Қазақша</option><option value="ru">Русский</option><option value="en">English</option></select><button id="th">🌙</button></header>
<main>

<div id="wrap">
<div class="topic-picker"><label id="topicLabel" for="topicSelect">Тақырыптар · 1–15</label><select id="topicSelect"></select></div>
<div class="tabs" id="tabs"></div>
<section class="card" id="reader"><div class="rd" id="rd"></div></section>
<div id="prac">
<section class="card" id="left"></section>
<section class="card" id="edsec">
<div class="ed" id="ed"><div class="gut" id="gut"></div><div class="code"><pre id="hl"></pre><textarea class="src" id="src" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea><div id="pop"></div></div></div>
<div class="row"><button class="btn" id="chk">✔</button><button class="btn g" id="run">▶</button><button class="btn g" id="rst">↺</button><span id="tips" class="eng"></span></div>
<h3 id="inl"></h3><textarea class="inp" id="inp"></textarea>
<div id="res"></div>
</section>
</div>
</div>
</main>

function withMainReturn(code){

  if(mask[i]==='{')depth++;if(mask[i]==='}'&&!--depth)return code.slice(0,i)+'\nreturn 0;\n'+code.slice(i);
 }return code;
}

function ins(a,b,txt,caret){const v=src.value;src.value=v.slice(0,a)+txt+v.slice(b);const p=a+(caret===undefined?txt.length:caret);src.setSelectionRange(p,p);render()}
function word(){const p=src.selectionStart,m=/[A-Za-z_#]\w*$/.exec(src.value.slice(0,p));return m?m[0]:''}
function showPop(){const w=word();items=[];if(w.length>=2){Object.keys(SN).forEach(k=>{if(k.startsWith(w))items.push([k+' ⋯',k,SN[k]])});KW.forEach(k=>{if(k.startsWith(w)&&k!==w)items.push([k,k,k])})}items=items.slice(0,6);if(!items.length){pop.style.display='none';return}
 sel=0;const L=src.value.slice(0,src.selectionStart).split('\n'),cw=7.9;pop.style.top=(L.length*20+10)+'px';pop.style.left=(12+L[L.length-1].length*cw)+'px';drawPop();pop.style.display='block'}
function drawPop(){pop.innerHTML=items.map((x,i)=>'<div class="'+(i==sel?'on':'')+'" data-i="'+i+'">'+esc(x[0])+'</div>').join('')}
function accept(i){const w=word(),p=src.selectionStart,t=items[i][2],c=t.indexOf('|');ins(p-w.length,p,t.replace('|',''),c<0?undefined:c);pop.style.display='none'}
pop.onmousedown=e=>{e.preventDefault();const d=e.target.closest('div');if(d)accept(+d.dataset.i)};
src.addEventListener('input',()=>{errs=new Set();render();showPop()});
src.addEventListener('click',()=>pop.style.display='none');
src.addEventListener('keydown',e=>{const open=pop.style.display==='block';
 if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();safeAction(doCheck);return}
 if(open){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:items.length-1))%items.length;drawPop();return}
 if(e.key==='Tab'||e.key==='Enter'){e.preventDefault();accept(sel);return}if(e.key==='Escape'){pop.style.display='none';return}}
 const a=src.selectionStart,b=src.selectionEnd,v=src.value;
 if(e.key==='Tab'){e.preventDefault();ins(a,b,'    ');return}
 if(e.key==='Enter'){e.preventDefault();const s0=v.lastIndexOf('\n',a-1)+1,ind=/^\s*/.exec(v.slice(s0,a))[0];
 if(v[a-1]==='{'&&v[a]==='}'){ins(a,b,'\n'+ind+'    \n'+ind,ind.length+5)}else ins(a,b,'\n'+ind+(v[a-1]==='{'?'    ':''));return}
 const P={'(':')','[':']','{':'}','"':'"'};
 if(')]}\"'.includes(e.key)&&v[a]===e.key&&a===b){e.preventDefault();src.setSelectionRange(a+1,a+1);return}
 if(P[e.key]&&a===b){e.preventDefault();ins(a,b,e.key+P[e.key],1);return}
 if(')]}"'.includes(e.key)&&v[a]===e.key&&a===b){e.preventDefault();src.setSelectionRange(a+1,a+1)}});
/* тема и язык */
$('th').onclick=()=>{const r=document.documentElement,d=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';r.dataset.theme=d?'light':'dark';$('th').textContent=d?'🌙':'☀';ls('theme',r.dataset.theme)};
(function(){const t=ls('theme')||'light';if(t){document.documentElement.dataset.theme=t;$('th').textContent=t==='dark'?'☀':'🌙'}else if(matchMedia('(prefers-color-scheme:dark)').matches)$('th').textContent='☀'})();
function applyLang(){document.documentElement.lang=lang;$('lg').value=lang;$('rst').textContent=u('rst');$('run').textContent=u('run');$('chk').textContent=u('chk');$('tips').textContent=u('tips');$('inl').textContent=u('inp');show()}
$('lg').onchange=()=>{lang=$('lg').value;ls('lang',lang);applyLang()};
vi=+(ls('v'+cur)||0);if(!(vi>=0&&vi<T[cur].V.length))vi=0;
applyLang();
